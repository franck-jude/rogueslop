steps:
  # ========== 1. Vérifier la présence du projet ==========
  - type: command
    command: if not exist projects\roguelike mkdir projects\roguelike

  # ========== 2. Initialiser Git ==========
  - type: git
    action: init
    cwd: projects/roguelike

  # ========== 3. Ajouter tous les fichiers ==========
  - type: git
    action: add
    cwd: projects/roguelike
    path: .

  # ========== 4. Commit du MVP ==========
  - type: git
    action: commit
    cwd: projects/roguelike
    message: "MVP roguelike - donjon ASCII, déplacement, monstres, escaliers, items"

  # ========== 5. Vérifier le statut ==========
  - type: git
    action: status
    cwd: projects/roguelike

  # ========== 6. Afficher les derniers commits ==========
  - type: command
    command: git -C projects/roguelike log --oneline -3