steps:
  - type: command
    command: mkdir ..\agent_repo -Force

  - type: command
    command: xcopy . ..\agent_repo /E /I /H /Y

  - type: command
    command: cd ..\agent_repo ; git init

  - type: command
    command: cd ..\agent_repo ; git add .

  - type: command
    command: cd ..\agent_repo ; git commit -m "Agent autonome - version stable avec tests, parser, UI, GitManager"

  - type: command
    command: cd ..\agent_repo ; git remote add origin https://github.com/ton-compte/agent-roguelike.git

  - type: command
    command: cd ..\agent_repo ; git branch -M main

  - type: command
    command: cd ..\agent_repo ; git push -u origin main