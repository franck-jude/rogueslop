[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "Modular AI agent"
authors = [{name = "Vic Viper"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyautogui",
    "pyperclip",
    "keyboard",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pyyaml",
]

[project.scripts]
agent = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
exclude = ["tests*", "config*", "modules*", "logs*", "backups*"]

[tool.pytest.ini_options]

testpaths = ["tests"]
pythonpath = ["."]